services:
  galonkulanding:
    image: dandikurnia/galonkulanding:latest
    container_name: galonkulanding
    build:
      context: .
      dockerfile: DockerFile
    restart: unless-stopped
    ports:
      - "3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Jakarta
      FASTAPI_BASE_URL: http://host.docker.internal:8000
      FASTAPI_API_KEY: ${FASTAPI_API_KEY}
      REDIS_URL: redis://host.docker.internal:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005"]
      interval: 15s
      timeout: 10s
      retries: 3

